<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Slocum Junk Solutions</title>
  
  <!-- External CSS Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="images/logo.png">

  <style>
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      color: var(--brand-dark);
    }
    .form-group input, 
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px;
    }
    .form-group textarea {
      height: 140px;
      resize: vertical;
    }
  </style>
</head>
<body>

  <!-- Navigation Header -->
  <header>
    <div class="nav-container">
      <div class="logo">
        <a href="index.html">
          <img src="images/logo.png" alt="Slocum Junk Solutions Logo">
        </a>
      </div>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="residential.html">Residential</a></li>
          <li><a href="commercial.html">Commercial</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
      </nav>
      <a href="tel:4012672803" class="phone-cta">401-267-2803</a>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <h1>Contact Slocum Junk Solutions</h1>
    <p>Call us directly at 401-267-2803 or fill out the form below to receive a free estimate.</p>
  </section>

  <!-- Form Container -->
  <main class="container" style="max-width: 650px;">
    <div class="card">
      <form action="https://api.web3forms.com/submit" method="POST">
        <!-- Get a free access key at https://web3forms.com to direct emails to your inbox -->
        <input type="hidden" name="access_key" value="YOUR_WEB3FORMS_ACCESS_KEY">

        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" name="name" required placeholder="John Smith">
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" required placeholder="401-555-0199">
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required placeholder="name@example.com">
        </div>

        <div class="form-group">
          <label for="service">Service Needed</label>
          <input type="text" id="service" name="service" placeholder="e.g. Garage Cleanout, Commercial Hauling">
        </div>

        <div class="form-group">
          <label for="message">Details / Items to Remove</label>
          <textarea id="message" name="message" required placeholder="Describe the items or job details..."></textarea>
        </div>

        <button type="submit" class="btn" style="width: 100%;">Submit Request</button>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; Slocum Junk Solutions. All Rights Reserved. | Phone: <a href="tel:4012672803" style="color: #ffffff; text-decoration: none;">401-267-2803</a></p>
  </footer>

</body>
</html>
