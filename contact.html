<main class="container" style="max-width: 650px;">
  <div class="card">
    <form action="https://api.web3forms.com/submit" method="POST">
      <!-- Paste your Web3Forms Access Key below to route messages to info@slocumjunk.com -->
      <input type="hidden" name="access_key" value="cf52402b-b659-4f13-af31-c0fe48f5f368">

      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" required placeholder="John Smith">
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" required placeholder="401-555-0199">
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required placeholder="name@example.com">
        <p class="help-text" style="font-size: 0.85rem; color: #555; margin-top: 4px;">
          📸 <em>Check your inbox immediately after submitting — reply to our instant email with photos for a faster, exact quote!</em>
        </p>
      </div>

      <div class="form-group">
        <label for="service">Service Needed</label>
        <input type="text" id="service" name="service" placeholder="e.g. Garage Cleanout, Commercial Hauling">
      </div>

      <div class="form-group">
        <label for="message">Details / Items to Remove</label>
        <textarea id="message" name="message" required placeholder="Describe the items or job details..."></textarea>
      </div>

      <div class="photo-notice" style="background-color: #f8f9fa; border-left: 4px solid #28a745; padding: 10px 14px; margin-bottom: 16px; border-radius: 4px;">
        <p style="margin: 0; font-size: 0.9rem; color: #333;">
          <strong>Need a fast, exact quote?</strong> Once submitted, check your inbox for our instant email confirmation and reply directly with photos of your items or job site.
        </p>
      </div>

      <button type="submit" class="btn" style="width: 100%;">Submit Request</button>
    </form>
  </div>
</main>
</body>
</html>
