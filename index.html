<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My GitHub Site</title>
  <style>
    :root {
      --primary-color: #0969da;
      --bg-color: #f6f8fa;
      --card-bg: #ffffff;
      --text-color: #1f2328;
      --border-color: #d0d7de;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --primary-color: #2f81f7;
        --bg-color: #0d1117;
        --card-bg: #161b22;
        --text-color: #e6edf3;
        --border-color: #30363d;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }

    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 2rem 1rem;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 2.5rem;
    }

    header p {
      margin-top: 0.5rem;
      color: var(--primary-color);
    }

    main {
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    a {
      color: var(--primary-color);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      font-size: 0.9rem;
      color: var(--border-color);
    }
  </style>
</head>
<body>

  <header>
    <h1>Welcome to My Website</h1>
    <p>Hosted on GitHub Pages</p>
  </header>

  <main>
    <div class="card">
      <h2>About Me</h2>
      <p>Hello! This is a simple, responsive website built using HTML and CSS.</p>
    </div>

    <div class="card">
      <h2>Projects</h2>
      <ul>
        <li><a href="#">Project One</a> - Short description of project one.</li>
        <li><a href="#">Project Two</a> - Short description of project two.</li>
      </ul>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Your Name. Powered by GitHub Pages.</p>
  </footer>

</body>
</html>
