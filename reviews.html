<!DOCTYPE html>
<html lang="en">
<head>

  <!-- External CSS Stylesheet -->
  <link rel="stylesheet" href="./css/styles.css">
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testimonials That Speak for Themselves</title>
  <style>
    :root {
      --primary-color: #1a202c;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --shadow-color: rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--primary-color);
      line-height: 1.6;
      padding: 3rem 1rem;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .header p {
      font-size: 1.1rem;
      color: #64748b;
    }

    .reviews-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2rem;
    }

    .review-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 12px var(--shadow-color);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .review-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
    }

    .review-image {
      width: 100%;
      height: auto;
      display: block;
      border-bottom: 1px solid var(--border-color);
    }

    .review-caption {
      padding: 1rem 1.25rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: #475569;
      background-color: #fafafa;
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="header">
      <h1>Testimonials That Speak for Themselves</h1>
      <p>See what our clients have to say about working with us.</p>
    </header>

    <main class="reviews-grid">
      <div class="review-card">
        <img src="media/RE1.png" alt="Client Review 1" class="review-image">
        <div class="review-caption">Client Review #1</div>
      </div>

      <div class="review-card">
        <img src="media/RE2.png" alt="Client Review 2" class="review-image">
        <div class="review-caption">Client Review #2</div>
      </div>

      <div class="review-card">
        <img src="media/RE3.png" alt="Client Review 3" class="review-image">
        <div class="review-caption">Client Review #3</div>
      </div>

      <div class="review-card">
        <img src="media/RE4.png" alt="Client Review 4" class="review-image">
        <div class="review-caption">Client Review #4</div>
      </div>

      <div class="review-card">
        <img src="media/RE5.png" alt="Client Review 5" class="review-image">
        <div class="review-caption">Client Review #5</div>
      </div>

      <div class="review-card">
        <img src="media/RE6.png" alt="Client Review 6" class="review-image">
        <div class="review-caption">Client Review #6</div>
      </div>
    </main>
  </div>

</body>
</html>
