<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // Map legacy URLs to current site pages
    var pathMap = {
      '/residential': '/',
     '/residential.html': '/',
      '/residential-1': '/',
      '/dumpster-rental': '/services',
      '/contact.html': '/contact',
      '/reviews.html': '/reviews'
    };

    var currentPath = window.location.pathname;
    var cleanPath = pathMap[currentPath] || '/';

    // Immediate JS redirect to active page
    window.location.replace(cleanPath);
  </script>
</head>
<body>
  <p>Redirecting to <a id="redirect-link" href="/">Slocum Junk Solutions</a>...</p>
</body>
</html>
