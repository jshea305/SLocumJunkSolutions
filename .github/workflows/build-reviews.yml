name: Pre-render Reviews HTML

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/reviews.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run review generator
        run: node js/generate-reviews.js

      - name: Commit updated HTML
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: pre-render reviews HTML"
          file_pattern: 'reviews.html'
